# ─────────────────────────────────────────────────────────────────────────────
# Home Credit — PD model: API + dashboard + MLflow
#
# Prerequisito: correr `python run_all.py` (genera models/ y reports/)
#
#   docker compose -f docker/docker-compose.yml up --build
#     API        → http://localhost:8000/docs
#     Dashboard  → http://localhost:8501
#     MLflow     → http://localhost:5000
# ─────────────────────────────────────────────────────────────────────────────
services:

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: credit-risk-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  streamlit:
    build:
      context: ..
      dockerfile: docker/Dockerfile.streamlit
    container_name: credit-risk-dashboard
    ports:
      - "8501:8501"
    volumes:
      # Monta el modelo local para habilitar el simulador individual
      - ../models:/app/models:ro
      - ../data/processed:/app/data/processed:ro
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: credit-risk-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ../mlflow.db:/mlflow/mlflow.db
      - ../mlruns:/mlflow/mlruns
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/mlruns
      --host 0.0.0.0 --port 5000
    restart: unless-stopped
